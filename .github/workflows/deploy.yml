name: Despliegue Cloudflare (capacitacion.sabicentec.com)
on:
  push: { branches: [main] }
  workflow_dispatch:
concurrency: { group: despliegue-cloudflare, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar llave de Cloudflare
        env: { T: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: |
          if [ -z "$T" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en este repositorio (Settings → Secrets and variables → Actions)."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Revisar el guardián
        run: node --check worker/index.js
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: 'true'
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | tee salida.txt || { sed 's/\x1b\[[0-9;]*m//g' salida.txt | grep -v '^\s*$' | tail -20 | while read -r l; do echo "::error::${l:0:300}"; done; exit 1; }
